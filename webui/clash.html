<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>代理节点 · MEM·REDUCT</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%230a0e12'/><path d='M3 8h10M8 3v10' stroke='%23ffb000' stroke-width='1.5'/></svg>">
<style>
:root,body[data-theme=dark]{--bg:#0a0e12;--panel:#10161d;--panel2:#0c1117;--line:#22303a;--line2:#31424f;--ink:#dbe4ea;--dim:#82939f;--dim2:#61717c;--amber:#ffb000;--cyan:#43c6de;--green:#3ddc84;--red:#ff6471;--warn:#ffad46;--grid:rgba(255,255,255,.018);--shadow:rgba(0,0,0,.32);--soft:#a9b8c4;--active:rgba(67,198,222,.07)}
body[data-theme=light]{--bg:#e9edf1;--panel:#fff;--panel2:#f4f7fa;--line:#d4dde4;--line2:#b9c6d1;--ink:#1b2632;--dim:#5c6b78;--dim2:#718390;--amber:#bd7a00;--cyan:#1484a3;--green:#148653;--red:#c73547;--warn:#b75d0b;--grid:rgba(0,0,0,.035);--shadow:rgba(30,45,60,.11);--soft:#3d4c5a;--active:rgba(20,132,163,.06)}
body[data-theme=color]{--bg:#12071f;--panel:#1b0f2e;--panel2:#150b26;--line:#3d2a5c;--line2:#584077;--ink:#efe6ff;--dim:#ae9dcb;--dim2:#81749f;--amber:#ffd166;--cyan:#4cc9f0;--green:#06d6a0;--red:#ff718c;--warn:#ffad69;--grid:rgba(255,255,255,.025);--shadow:rgba(20,5,40,.4);--soft:#cdbde5;--active:rgba(76,201,240,.08)}
*{box-sizing:border-box}html{scrollbar-color:var(--line2) var(--bg)}body{margin:0;min-height:100vh;color:var(--ink);background:var(--bg);font-family:'Microsoft YaHei',system-ui,sans-serif;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:44px 44px}
body:before{content:'';position:fixed;inset:0;pointer-events:none;z-index:5;background:repeating-linear-gradient(0deg,transparent 0 2px,rgba(255,255,255,.012) 2px 3px)}
button,select,input{font:inherit}button,a,select{touch-action:manipulation}.wrap{max-width:1180px;margin:auto;padding:22px 20px 48px;position:relative}.mono{font-family:'Cascadia Mono',Consolas,monospace}
.top{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;padding-bottom:16px}.brand{display:flex;align-items:center;gap:13px}.mark{height:32px;width:32px;border:1px solid var(--amber);display:grid;place-items:center;color:var(--amber);font:700 16px Consolas;box-shadow:inset 0 0 14px var(--shadow)}h1{font-family:Bahnschrift,'Microsoft YaHei',sans-serif;font-size:20px;letter-spacing:.06em;margin:0;color:var(--amber)}h1 span{font-size:15px;color:var(--ink);margin-left:8px}.subtitle{color:var(--dim);font-size:9px;letter-spacing:.25em;margin-top:4px}.top-actions,.tools,.card-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.button{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;white-space:nowrap;border:1px solid var(--line2);border-radius:3px;color:var(--ink);background:var(--panel);padding:9px 13px;font-size:12px;font-weight:600;cursor:pointer;transition:border-color .16s,transform .16s,background .16s}.button:hover{border-color:var(--cyan);transform:translateY(-1px)}.button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}.button:disabled{opacity:.48;cursor:not-allowed;transform:none}.button.primary{background:var(--amber);border-color:var(--amber);color:#171105}.button.small{font-size:11px;padding:7px 10px}.button.ghost{background:transparent;color:var(--dim)}
.rule{height:8px;border-top:1px solid var(--line);background:repeating-linear-gradient(90deg,var(--line2) 0 1px,transparent 1px 16px) top/100% 5px no-repeat}.status{display:flex;align-items:center;gap:9px;font-size:11px;color:var(--dim);padding:14px 0}.dot{width:7px;height:7px;border-radius:50%;background:var(--dim2);flex:none}.dot.ok{background:var(--green);box-shadow:0 0 9px var(--green)}.dot.error{background:var(--red);box-shadow:0 0 8px var(--red)}.status .right{margin-left:auto;color:var(--dim2);font-size:10px;letter-spacing:.1em}
.hero{display:grid;grid-template-columns:minmax(0,1fr) 330px;border:1px solid var(--line);background:linear-gradient(115deg,var(--panel),var(--panel2));box-shadow:0 12px 30px var(--shadow)}.hero-main{padding:23px 25px 25px;min-width:0}.eyebrow{font:10px 'Cascadia Mono',Consolas,monospace;letter-spacing:.18em;color:var(--dim)}.hero h2{margin:10px 0 3px;color:var(--ink);font-size:22px;line-height:1.3;overflow-wrap:anywhere}.hero .group-name{font-size:12px;color:var(--dim);min-height:18px}.current-row{display:flex;align-items:center;gap:8px;color:var(--green);font:10px 'Cascadia Mono',Consolas,monospace;letter-spacing:.14em;margin-top:20px}.current-row:before{content:'';width:17px;height:1px;background:var(--green)}.hero-side{border-left:1px solid var(--line);padding:22px 25px;display:flex;flex-direction:column;justify-content:center;gap:11px}.label{font-size:11px;color:var(--dim);letter-spacing:.12em}.select{width:100%;height:40px;color:var(--ink);background:var(--panel2);border:1px solid var(--line2);padding:0 10px;border-radius:3px;cursor:pointer}.hint{font-size:11px;color:var(--dim);line-height:1.6}
.section-head{display:flex;justify-content:space-between;align-items:end;gap:15px;flex-wrap:wrap;margin:29px 0 13px}.section-head h3{font-size:15px;letter-spacing:.1em;margin:0 0 5px}.section-head p{font:10px 'Cascadia Mono',Consolas,monospace;color:var(--dim);margin:0;letter-spacing:.11em}.tools{justify-content:flex-end}.search{width:185px;height:36px;color:var(--ink);background:var(--panel2);border:1px solid var(--line2);border-radius:3px;padding:0 10px;font-size:12px}.search::placeholder{color:var(--dim2)}.sort{width:auto;height:36px;font-size:11px;min-width:112px}
.progress{display:none;margin-bottom:13px;border:1px solid var(--line);background:var(--panel2);padding:11px 13px;align-items:center;gap:12px;font-size:11px;color:var(--soft)}.progress.visible{display:flex}.progress-track{height:3px;flex:1;background:var(--line2);min-width:50px}.progress-bar{height:100%;width:0;background:var(--cyan);transition:width .3s}.progress .button{margin-left:auto}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.node{position:relative;display:flex;flex-direction:column;min-height:125px;border:1px solid var(--line);background:var(--panel);padding:16px;box-shadow:0 5px 18px var(--shadow);transition:border-color .16s,background .16s}.node:hover{border-color:var(--line2)}.node.active{border-color:var(--cyan);background:linear-gradient(110deg,var(--active),var(--panel))}.node.active:before{content:'';position:absolute;left:-1px;top:-1px;bottom:-1px;width:3px;background:var(--cyan)}.node-main{display:flex;justify-content:space-between;align-items:start;gap:10px;min-width:0}.node-name{font-size:14px;font-weight:600;line-height:1.45;overflow-wrap:anywhere}.node-tag{display:inline-block;margin-top:8px;margin-right:5px;padding:3px 6px;border:1px solid var(--line2);color:var(--dim);font:10px Consolas,monospace;border-radius:2px}.node-detail{font-size:10px;color:var(--dim);margin-top:8px;overflow-wrap:anywhere}.latency{flex:none;text-align:right;font:600 20px Bahnschrift,Consolas,sans-serif;white-space:nowrap;color:var(--dim2)}.latency small{font:10px Consolas,monospace;margin-left:3px}.latency.good{color:var(--green)}.latency.mid{color:var(--cyan)}.latency.slow{color:var(--warn)}.latency.bad{font-size:12px;color:var(--red)}.card-bottom{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-top:auto;padding-top:13px}.card-state{font:10px Consolas,monospace;letter-spacing:.09em;color:var(--dim2)}.active .card-state{color:var(--cyan)}.empty{grid-column:1/-1;border:1px dashed var(--line2);padding:45px 20px;color:var(--dim);text-align:center;font-size:13px;line-height:1.7}.footer{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);margin-top:25px;padding-top:14px;color:var(--dim2);font-size:10px;line-height:1.6}.toast{position:fixed;right:22px;bottom:22px;z-index:10;max-width:min(360px,calc(100vw - 44px));padding:12px 15px;border:1px solid var(--line2);background:var(--panel);box-shadow:0 10px 28px var(--shadow);color:var(--ink);font-size:12px;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:none}.toast.error{border-color:var(--red)}
@media(max-width:700px){.wrap{padding:17px 14px 36px}.hero{grid-template-columns:1fr}.hero-main{padding:19px}.hero-side{border-left:0;border-top:1px solid var(--line);padding:16px 19px}.grid{grid-template-columns:1fr}.section-head{align-items:stretch}.tools{justify-content:flex-start;width:100%}.search{flex:1;min-width:130px}.status .right{display:none}.node{min-height:115px}.top-actions{width:100%}.top-actions .button{flex:1}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><div class="mark" aria-hidden="true">↗</div><div><h1>MEM·REDUCT <span>代理节点</span></h1><div class="subtitle">PROXY CONSOLE · 远程节点控制</div></div></div>
    <nav class="top-actions" aria-label="页面导航"><a class="button" href="/">← 返回监控台</a><button class="button" id="theme" type="button">◐ 主题</button></nav>
  </header>
  <div class="rule"></div>
  <div class="status" role="status" aria-live="polite"><span class="dot" id="statusDot"></span><span id="statusText">正在连接 Clash Verge…</span><span class="right mono">TAILNET / LOCAL BRIDGE</span></div>
  <section class="hero" aria-label="当前代理">
    <div class="hero-main"><div class="eyebrow">CURRENT ROUTE / 当前使用</div><h2 id="currentNode">—</h2><div class="group-name" id="currentGroup">等待获取代理组</div><div class="current-row">ACTIVE SELECTION</div></div>
    <div class="hero-side"><label class="label" for="group">选择代理组</label><select class="select" id="group" disabled><option>正在加载…</option></select><div class="hint" id="groupHint">选择代理组后，可以查看并切换该组节点。</div></div>
  </section>
  <section aria-labelledby="nodesTitle">
    <div class="section-head"><div><h3 id="nodesTitle">可用节点</h3><p><span id="nodeCount">00</span> NODES / 测速结果单位 MS</p></div><div class="tools"><input class="search" id="search" type="search" aria-label="搜索节点" placeholder="搜索节点名称"><select class="select sort" id="sort" aria-label="节点排序"><option value="original">默认排序</option><option value="delay">延迟从低到高</option></select><button class="button" id="refresh" type="button">↻ 刷新</button><button class="button primary" id="testAll" type="button" disabled>↗ 全部测速</button></div></div>
    <div class="progress" id="progress"><span id="progressText" aria-live="polite">测速准备中</span><div class="progress-track"><div class="progress-bar" id="progressBar"></div></div><button class="button small ghost" id="cancel" type="button">取消</button></div>
    <div class="grid" id="nodes"><div class="empty">正在读取代理组和节点…</div></div>
  </section>
  <footer class="footer"><span>延迟使用 Clash Verge 当前配置的测试目标。测速结果受网络状况影响。</span><span class="mono">MIHOMO / LOCAL CONTROLLER</span></footer>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
const $ = id => document.getElementById(id);
const app = {groups:[],nodes:new Map(),group:'',delays:new Map(),job:'',switching:'',online:false,timer:null};
const themes=['dark','light','color'];
function setTheme(theme){ if(!themes.includes(theme)) theme='dark';document.body.dataset.theme=theme;document.querySelector('meta[name="color-scheme"]').content=theme==='light'?'light':'dark';try{localStorage.setItem('mr-theme',theme)}catch(e){} }
try{setTheme(localStorage.getItem('mr-theme')||'dark')}catch(e){setTheme('dark')}
$('theme').addEventListener('click',()=>setTheme(themes[(themes.indexOf(document.body.dataset.theme)+1)%themes.length]));
function toast(message,error=false){const el=$('toast');el.textContent=message;el.className='toast show'+(error?' error':'');clearTimeout(app.timer);app.timer=setTimeout(()=>el.className='toast',3600)}
function setStatus(text,ok){$('statusText').textContent=text;$('statusDot').className='dot '+(ok?'ok':'error');app.online=!!ok}
async function api(path,options){const response=await fetch(path,Object.assign({cache:'no-store'},options));let data;try{data=await response.json()}catch(e){throw new Error('服务返回了无效数据')}if(!response.ok||!data.ok)throw new Error(data.err||('请求失败 · HTTP '+response.status));return data}
function selectedGroup(){return app.groups.find(group=>group.name===app.group)}
function element(tag,className,text){const item=document.createElement(tag);if(className)item.className=className;if(text!==undefined)item.textContent=text;return item}
function setGroups(){const select=$('group');select.replaceChildren();for(const group of app.groups){const option=element('option','',group.name);option.value=group.name;select.append(option)}select.value=app.group;select.disabled=!app.groups.length}
function delayFor(name,node){if(app.delays.has(name))return app.delays.get(name);return node&&node.delay!==null&&node.delay!==undefined?{delay:Number(node.delay),status:Number(node.delay)>0?'history':'timeout'}:null}
function render(){
  const group=selectedGroup();$('currentNode').textContent=group&&group.now?group.now:'—';$('currentGroup').textContent=group?'代理组 · '+group.name:'没有可手动切换的代理组';
  $('groupHint').textContent=group?group.all.length+' 个节点 · 切换后新连接使用所选节点':'请在 Clash Verge 中确认存在可手动选择的代理组。';
  $('nodeCount').textContent=String(group?group.all.length:0).padStart(2,'0');$('testAll').disabled=!app.online||!group||!!app.job;
  const container=$('nodes');container.replaceChildren();if(!group){container.append(element('div','empty',app.online?'暂无可手动切换的代理组。':'无法读取节点，请检查 Clash Verge 是否运行。'));return}
  const search=$('search').value.trim().toLocaleLowerCase();let names=group.all.filter(name=>name.toLocaleLowerCase().includes(search));
  if($('sort').value==='delay'){const original=new Map(names.map((name,index)=>[name,index]));names.sort((a,b)=>{const x=delayFor(a,app.nodes.get(a)),y=delayFor(b,app.nodes.get(b));const dx=x&&x.delay>0?x.delay:Infinity,dy=y&&y.delay>0?y.delay:Infinity;return dx-dy||original.get(a)-original.get(b)})}
  if(!names.length){container.append(element('div','empty','没有找到匹配的节点。'));return}
  for(const name of names){
    const node=app.nodes.get(name)||{name};const active=group.now===name;const card=element('article','node'+(active?' active':''));const main=element('div','node-main');const left=element('div');left.append(element('div','node-name',name));
    if(node.type)left.append(element('span','node-tag',node.type));if(node.udp)left.append(element('span','node-tag','UDP'));if(node.now&&node.now!==name)left.append(element('div','node-detail','当前：'+node.now));
    const info=delayFor(name,node);let value='—',unit='',cls='';if(info){if(info.delay>0){value=String(info.delay);unit='ms';cls=info.delay<200?'good':info.delay<400?'mid':'slow'}else{value=info.status==='error'?'失败':'超时';cls='bad'}}
    const latency=element('div','latency '+cls,value);if(unit)latency.append(element('small','',unit));latency.setAttribute('aria-label',info?(info.delay>0?'延迟 '+info.delay+' 毫秒':value):'暂无延迟数据');main.append(left,latency);card.append(main);
    const bottom=element('div','card-bottom');const state=element('div','card-state',active?'● 当前选择':info&&info.status==='history'?'上次测速':'');const actions=element('div','card-actions');
    const test=element('button','button small ghost','测速');test.type='button';test.disabled=!!app.job;test.setAttribute('aria-label','测试 '+name+' 的延迟');test.addEventListener('click',()=>startDelay(name));
    const choose=element('button','button small',active?'已选中':app.switching===name?'切换中…':'切换');choose.type='button';choose.disabled=active||!!app.switching;choose.setAttribute('aria-label',(active?'当前节点 ':'切换到 ')+name);choose.addEventListener('click',()=>switchNode(name));
    actions.append(test,choose);bottom.append(state,actions);card.append(bottom);container.append(card)
  }
}
async function loadData(quiet=false){$('refresh').disabled=true;try{const data=await api('/api/clash');app.groups=Array.isArray(data.groups)?data.groups:[];app.nodes=new Map((data.nodes||[]).map(node=>[node.name,node]));let saved='';try{saved=localStorage.getItem('mr-clash-group')||''}catch(e){}if(!app.groups.some(g=>g.name===app.group))app.group=app.groups.some(g=>g.name===saved)?saved:(app.groups.find(g=>g.name==='节点选择')||app.groups[0]||{}).name||'';setGroups();setStatus('Clash Verge 已连接',true);render();return true}catch(error){setStatus(error.message,false);render();if(!quiet)toast(error.message,true);return false}finally{$('refresh').disabled=false}}
async function switchNode(name){const group=selectedGroup();if(!group||app.switching||name===group.now)return;app.switching=name;render();try{const query=new URLSearchParams({group:group.name,node:name});await api('/api/clash/select?'+query,{method:'POST'});const loaded=await loadData(true);const actual=app.groups.find(item=>item.name===group.name);if(!loaded||!actual||actual.now!==name)throw new Error('已发送切换请求，请刷新确认当前节点');toast('已切换至 '+name)}catch(error){toast(error.message,true)}finally{app.switching='';render()}}
function progress(text,count,total){$('progress').classList.add('visible');$('progressText').textContent=text;$('progressBar').style.width=(total?Math.min(100,count/total*100):0)+'%'}
async function startDelay(node=''){const group=selectedGroup();if(!group||app.job)return;try{const query=new URLSearchParams({group:group.name});if(node)query.set('node',node);const result=await api('/api/clash/delay/start?'+query,{method:'POST'});app.job=result.id;progress('测速进行中…',0,1);render();pollDelay(result.id)}catch(error){toast(error.message,true)}}
async function pollDelay(id){while(app.job===id){try{const result=await api('/api/clash/delay/status?'+new URLSearchParams({id}));for(const item of result.results||[])app.delays.set(item.name,item);const count=(result.results||[]).length;progress('测速 '+count+' / '+result.total,count,result.total);render();if(result.state!=='running'){app.job='';$('progress').classList.remove('visible');render();toast(result.state==='done'?'测速完成':result.state==='cancelled'?'已取消测速':'测速中断',result.state==='error');return}}catch(error){app.job='';$('progress').classList.remove('visible');render();toast(error.message,true);return}await new Promise(resolve=>setTimeout(resolve,700))}}
$('group').addEventListener('change',event=>{app.group=event.target.value;try{localStorage.setItem('mr-clash-group',app.group)}catch(e){}render()});$('search').addEventListener('input',render);$('sort').addEventListener('change',render);$('refresh').addEventListener('click',()=>loadData());$('testAll').addEventListener('click',()=>startDelay());$('cancel').addEventListener('click',async()=>{if(!app.job)return;const id=app.job;try{await api('/api/clash/delay/cancel?'+new URLSearchParams({id}),{method:'POST'});app.job='';$('progress').classList.remove('visible');render();toast('已取消测速')}catch(error){toast(error.message,true)}});
async function resumeDelay(){try{const result=await api('/api/clash/delay/current');for(const item of result.results||[])app.delays.set(item.name,item);if(result.state==='running'&&result.id){app.job=result.id;progress('正在恢复测速进度…',(result.results||[]).length,result.total);pollDelay(result.id)}render()}catch(e){}}
loadData().then(resumeDelay);
</script>
</body>
</html>
